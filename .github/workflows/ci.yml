name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts examples
      - run: pytest
      - run: gulliblebench demo
      - run: gulliblebench generate-all
      - run: gulliblebench baselines
      - run: gulliblebench flip-cost
      - run: python examples/first_pair.py
      - run: python examples/synthetic_web_demo.py
      - run: python examples/meta_harness_demo.py
      - run: python examples/flip_cost_demo.py
      - name: frozen datasets and results must be byte-reproducible
        run: git diff --exit-code -- data results

  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,inspect]'
      - name: Inspect AI adapters must construct, not merely parse
        run: pytest tests/test_inspect_tasks.py -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify every tracked release file
        run: python scripts/verify_manifest.py
      - run: python -m pip install 'build>=1.2,<2'
      - run: python -m build
      - name: Install and smoke-test the wheel, outside the source tree
        run: |
          python -m venv "${RUNNER_TEMP}/gulliblebench-wheel"
          "${RUNNER_TEMP}/gulliblebench-wheel/bin/pip" install --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          gulliblebench-wheel/bin/python -c \
            "import gulliblebench, importlib.metadata as m; assert gulliblebench.__version__ == m.version('gulliblebench')"
          gulliblebench-wheel/bin/gulliblebench demo
          gulliblebench-wheel/bin/pip check
