[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gulliblebench"
version = "1.1.0"
description = "GULI-SET: a causal benchmark and process-improvement lab for manufactured consensus."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "GullibleBench contributors"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/zozo123/GULI-SET"
Repository = "https://github.com/zozo123/GULI-SET.git"
Issues = "https://github.com/zozo123/GULI-SET/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]
inspect = ["inspect-ai>=0.3"]
analysis = ["matplotlib>=3.8"]

[project.scripts]
gulliblebench = "gulliblebench.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]

[tool.setuptools.packages.find]
where = ["src"]
